<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Rishika ❤️</title>

<style>
body {
  margin:0;
  padding:0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #000000, #1a001a);
  color:white;
  text-align:center;
  overflow:hidden;
}

/* Heading */
h1 {
  margin-top:80px;
  font-size:32px;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { text-shadow:0 0 10px pink; }
  to { text-shadow:0 0 25px hotpink; }
}

/* Gift Button */
#giftBtn {
  margin-top:80px;
  padding:18px 40px;
  font-size:22px;
  border:none;
  border-radius:50px;
  background: linear-gradient(45deg, pink, red);
  color:white;
  cursor:pointer;
  box-shadow:0 0 20px pink;
  transition:0.3s;
}

#giftBtn:hover {
  transform:scale(1.1);
}

/* Message Box */
#messageBox {
  display:none;
  margin-top:40px;
  font-size:28px;
  color:#ff66b2;
  animation: fadeIn 2s ease-in-out;
}

@keyframes fadeIn {
  from {opacity:0; transform:translateY(20px);}
  to {opacity:1; transform:translateY(0);}
}

/* Floating Hearts */
.heart {
  position: absolute;
  color: pink;
  animation: float 6s linear infinite;
}

@keyframes float {
  0% {transform:translateY(100vh) scale(1);}
  100% {transform:translateY(-10vh) scale(1.5);}
}

/* Typing Text */
#typing {
  margin-top:20px;
  font-size:20px;
  color:white;
  width:80%;
  margin-left:auto;
  margin-right:auto;
  border-right:2px solid white;
  white-space:nowrap;
  overflow:hidden;
}
</style>
</head>

<body>

<h1>🎁 Tap to Open Your Special Gift 🎁</h1>

<button id="giftBtn" onclick="openGift()">Open Your Gift 💖</button>

<div id="messageBox">
  🎉 Happy Birthday Rishika 💖 <br><br>
  <div id="typing"></div>
</div>

<audio id="music" loop>
  <source src="https://www.soundjay.com/human/happy-birthday-01.mp3" type="audio/mpeg">
</audio>

<script>
// Gift open function
function openGift() {
  document.getElementById("messageBox").style.display = "block";
  document.getElementById("music").play();
  startTyping();
  createHearts();
}

// Typing effect
let text = "You are the most beautiful part of my life ❤️ Every moment with you feels special ✨ Stay happy always Rishika 💖";
let i = 0;

function startTyping() {
  let speed = 50;
  function type() {
    if (i < text.length) {
      document.getElementById("typing").innerHTML += text.charAt(i);
      i++;
      setTimeout(type, speed);
    }
  }
  type();
}

// Heart animation
function createHearts() {
  setInterval(() => {
    let heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 6000);
  }, 300);
}
</script>

</body>
</html>
